<style>
/* BE MY AURA — shared look for the pages after the hero: a cold, pale specimen archive. Single light look by design. */
:root {
  --paper: #E6EBEE;
  --paper-2: #F1F4F5;
  --void: #B9C6CE;
  --ink: #0D1114;
  --ink-muted: #4F5A61;
  --line: #A9B4BB;
  --line-soft: #CBD3D8;
  --signal: #C8261B;
  --night: #0D1114;
  --night-ink: #E8EEF1;
  --f-display: "Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --f-serif: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
  --f-sans: "IBM Plex Sans KR", "Pretendard", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:lang(ko) body, html[lang="ko"] body { word-break: keep-all; overflow-wrap: break-word; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body.page { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-sans); font-size: 16px; line-height: 1.75; overflow-x: hidden; }
body.page::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.meta { font-family: var(--f-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.label { font-family: var(--f-mono); font-size: 13px; line-height: 18px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.sig { color: var(--signal); }
.serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--signal); outline-offset: 3px; }

/* sticky navigation for the sub pages */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 16px; background: color-mix(in srgb, var(--paper) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); }
.nav .brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.nav .brand i { width: 7px; height: 7px; border-radius: 999px; background: var(--signal); }
.nav nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: flex-end; }
.nav nav a { text-decoration: none; }
.nav nav a:hover, .nav nav a[aria-current="page"] { color: var(--signal); }

.lang { display: inline-flex; border: 1px solid var(--line); background: none; padding: 0; cursor: pointer; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; }
.lang span { padding: 3px 7px; color: var(--ink-muted); }
.lang span.on { background: var(--ink); color: var(--paper); }

.btn { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--ink); padding: 11px 18px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); text-decoration: none; background: transparent; cursor: pointer; transition: background-color .15s linear, color .15s linear; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: var(--signal); border-color: var(--signal); }

.display { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; line-height: .9; margin: 0; text-wrap: balance; }
.lead { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.7; max-width: 38em; margin: 0; }
.muted { color: var(--ink-muted); }

/* spec table: label / value rows */
.spec { margin: 0; border-top: 1px solid var(--ink); }
.spec > div { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr); gap: 16px; padding-block: 11px; border-bottom: 1px solid var(--line-soft); }
.spec dt { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding-top: 3px; }
.spec dd { margin: 0; min-width: 0; }

/* section header with a rule */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--ink); padding-bottom: 10px; margin-bottom: 32px; flex-wrap: wrap; }

/* something the owner still has to supply */
.todo { border: 1px dashed var(--line); padding: 14px 16px; color: var(--ink-muted); font-size: 14px; line-height: 1.6;
  background: repeating-linear-gradient(45deg, transparent 0 9px, color-mix(in srgb, var(--line) 16%, transparent) 9px 10px); }
.todo::before { content: "TO ADD · "; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--signal); }

/* image slot with crosshair */
.slot { position: relative; display: grid; place-items: center; background: linear-gradient(180deg, var(--paper-2), var(--line-soft)); color: var(--ink-muted); overflow: hidden; }
.slot::before, .slot::after { content: ""; position: absolute; background: color-mix(in srgb, var(--ink) 18%, transparent); }
.slot::before { left: 50%; top: 0; bottom: 0; width: 1px; }
.slot::after { top: 50%; left: 0; right: 0; height: 1px; }
.slot span { position: relative; z-index: 1; background: var(--paper-2); padding: 6px 10px; border: 1px solid var(--line); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-align: center; max-width: 80%; }

.foot { border-top: 1px solid var(--line); padding-block: 32px 48px; display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
.code { height: 36px; width: 200px; max-width: 100%; background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 3px, var(--ink) 3px 5px, transparent 5px 6px, var(--ink) 6px 7px, transparent 7px 11px); }

.nav .brand { white-space: nowrap; }
@media (max-width: 640px) {
  .nav nav { gap: 10px; }
  .nav .label { font-size: 12px; letter-spacing: .04em; }
  .spec > div { grid-template-columns: 1fr; gap: 2px; }
}

/* Layout: an index of four specimens in a 2x2 grid; each opens into a case study on the same page (#spec-00N). */
.page-head { padding-block: 72px 48px; display: grid; gap: 20px; }
.page-head .display { font-size: clamp(64px, 12vw, 168px); }
.page-head .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 24px; padding-bottom: 96px; }
@media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }
.card { display: grid; gap: 12px; text-decoration: none; color: var(--ink); }
.card .cover { position: relative; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(180deg, #EEF2F4, #C9D2D8); }
.card .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease, filter .3s linear; }
.card .cover img.fit { object-fit: contain; object-position: center bottom; padding-top: 6%; }
.card .cover .pair { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: end; }
.card .cover .pair img { position: static; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; padding-top: 8%; }
.card .cover .slot { position: absolute; inset: 0; }
.card .corner { position: absolute; left: 10px; top: 8px; z-index: 2; font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; }
.card:hover .cover { border-color: var(--signal); }
.card:hover .cover img { transform: scale(1.03); }
.card:hover .cover img:not(.keep) { filter: invert(1) grayscale(1) contrast(1.1); }
.card .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card h2 { margin: 0; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.05; }
.card p { margin: 0; color: var(--ink-muted); font-size: 15px; line-height: 1.65; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tags span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); padding: 2px 7px; }

/* case study */
.case { padding-block: 40px 96px; display: grid; gap: 56px; }
.crumbs { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--signal); }
.case-head { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px 48px; align-items: start; }
@media (max-width: 900px) { .case-head { grid-template-columns: 1fr; } }
.case-head h1 { margin: 6px 0 18px; font-size: clamp(52px, 8vw, 112px); line-height: .95; }
.case-fig { margin: 0; display: grid; gap: 8px; }
.case-fig .frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border: 1px solid var(--line); overflow: hidden; background: linear-gradient(180deg, #EEF2F4, #C9D2D8); }
.case-fig .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.case-fig .frame img.fit { object-fit: contain; object-position: center bottom; padding-top: 4%; }
.case-fig .frame .pair { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); align-items: end; }
.case-fig .frame .pair img { position: static; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; padding-top: 6%; }
.case-fig .frame .slot { position: absolute; inset: 0; }
.case-fig figcaption { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.blocks { display: grid; gap: 48px; max-width: 1080px; }
.block { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: 16px 40px; border-top: 1px solid var(--ink); padding-top: 16px; }
@media (max-width: 760px) { .block { grid-template-columns: 1fr; } }
.block h2 { margin: 0; }
.block .body { display: grid; gap: 14px; min-width: 0; }
.block p { margin: 0; max-width: 40em; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line-soft); }
.steps li::before { content: counter(s, decimal-leading-zero); font-family: var(--f-mono); font-size: 12px; color: var(--ink-muted); padding-top: 3px; }
.dropped { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.dropped li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; color: var(--ink-muted); }
.dropped li::before { content: "×"; font-family: var(--f-mono); color: var(--signal); }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .gallery { grid-template-columns: 1fr; } }
.gallery figure { margin: 0; display: grid; gap: 6px; }
.gallery .g { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border: 1px solid var(--line); overflow: hidden; background: linear-gradient(180deg, #EEF2F4, #C9D2D8); }
.gallery .g img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gallery .g img.fit { object-fit: contain; object-position: center bottom; padding-top: 6%; }
.gallery .g .slot { position: absolute; inset: 0; }
.links { display: flex; gap: 10px; flex-wrap: wrap; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--ink); padding-top: 16px; }
.pager a { display: grid; gap: 2px; text-decoration: none; }
.pager a:last-child { text-align: right; }
.pager a:hover .serif { color: var(--signal); }
.pager .serif { font-size: 26px; line-height: 1.1; }
</style>

<script>
/* KO / EN switch shared by every page. Any element with data-ko / data-en gets swapped. */
(function () {
  let lang = 'ko';
  try { const s = localStorage.getItem('bma-lang'); if (s === 'ko' || s === 'en') lang = s; } catch (e) {}
  function apply(l) {
    lang = l; document.documentElement.lang = l;
    document.querySelectorAll('[data-ko]').forEach((el) => { const v = el.dataset[l]; if (v != null) el.innerHTML = v; });
    document.querySelectorAll('.lang span').forEach((s) => s.classList.toggle('on', s.dataset.l === l));
    try { localStorage.setItem('bma-lang', l); } catch (e) {}
    document.dispatchEvent(new CustomEvent('bma-lang', { detail: l }));
  }
  window.BMA_LANG = () => lang;
  document.querySelectorAll('.lang').forEach((b) => b.addEventListener('click', () => apply(lang === 'ko' ? 'en' : 'ko')));
  apply(lang);
})();
</script>

<script>document.documentElement.lang = "en";</script>
<script>
(function () {
  const L = () => 'en';   // the site is English-only; Korean copy stays in the data for later use
  const t = (v) => (v == null ? '' : typeof v === 'string' ? v : (v[L()] ?? v.ko));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const slot = (label) => `<div class="slot"><span>${esc(t(UI.imgTodo))} · ${esc(t(label))}</span></div>`;
  function coverHTML(cover, alt) {
    const real = cover.filter((c) => c.src);
    if (!real.length) return slot(cover[0] && cover[0].label);
    if (real.length > 1) return `<div class="pair">${real.map((c) => `<img src="${c.src}" alt="${esc(alt)}" loading="lazy">`).join('')}</div>`;
    const c = real[0]; return `<img src="${c.src}" alt="${esc(alt)}" class="${c.fit ? 'fit' : ''} ${c.keep ? 'keep' : ''}" loading="lazy">`;
  }
  function renderIndex() {
    $cards.innerHTML = WORKS.map((w) => `
      <a class="card" href="#${w.id}" aria-label="${esc(w.title)} · ${esc(t(UI.open))}">
        <div class="cover"><span class="corner sig">${w.no}</span>${coverHTML(w.cover, w.title)}</div>
        <div class="row"><span class="meta sig">${w.no}</span><span class="meta">${esc(t(w.cls))}</span></div>
        <h2 class="serif">${esc(w.title)}</h2>
        <p>${esc(t(w.summary))}</p>
        <div class="tags"><span>${esc(t(w.nature))}</span><span>${esc(w.year)}</span></div>
      </a>`).join('');
  }
  function renderCase(id) {
    const i = WORKS.findIndex((w) => w.id === id); const w = WORKS[i];
    const prev = WORKS[(i + WORKS.length - 1) % WORKS.length], next = WORKS[(i + 1) % WORKS.length];
    const list = (arr, cls) => `<ol class="${cls}">${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`;
    const dropped = t(w.dropped) || [];
    const links = (w.links || []).map((l) => `<a class="btn" href="${l.href}" ${/^https?:/.test(l.href) ? 'target="_blank" rel="noopener"' : ''}>${esc(t(l.label))} ↗</a>`).join('');
    $case.innerHTML = `
      <nav class="crumbs label"><a href="#">${esc(t(UI.back))}</a><span class="meta">${w.no} / ${String(WORKS.length).padStart(3, '0')}</span></nav>
      <header class="case-head">
        <div>
          <span class="meta sig">${w.no} · ${esc(t(w.cls))}</span>
          <h1 class="serif">${esc(w.title)}</h1>
          <p class="lead">${esc(t(w.summary))}</p>
        </div>
        <dl class="spec">
          <div><dt>${esc(t(UI.role))}</dt><dd>${esc(t(w.role))}</dd></div>
          <div><dt>${esc(t(UI.year))}</dt><dd>${esc(w.year)}</dd></div>
          <div><dt>${esc(t(UI.nature))}</dt><dd>${esc(t(w.nature))}</dd></div>
          <div><dt>${esc(t(UI.tools))}</dt><dd>${esc(w.tools)}</dd></div>
          ${w.status ? `<div><dt>${esc(t(UI.status))}</dt><dd>${esc(t(w.status))}</dd></div>` : ''}
        </dl>
      </header>
      <figure class="case-fig">
        <div class="frame">${w.cover.filter((c) => c.src).length > 1 ? `<div class="pair">${[...w.cover, ...w.gallery.filter((g) => g.src && g.fit)].filter((c) => c.src).slice(0, 4).map((c) => `<img src="${c.src}" alt="">`).join('')}</div>` : coverHTML(w.cover, w.title)}</div>
        <figcaption><span class="meta">${w.no} · VIEW 01</span><span class="meta">${esc(w.title)}</span></figcaption>
      </figure>
      <div class="blocks">${(() => {
        const B = [
          [UI.goal, `<p>${esc(t(w.goal))}</p>`],
          [UI.concept, `<p>${esc(t(w.concept))}</p>`],
          [UI.process, list(t(w.process), 'steps')],
          dropped.length ? [UI.dropped, `<ul class="dropped">${dropped.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`] : null,
          [UI.result, `<div class="gallery">${w.gallery.filter((g) => g.src).map((g) => `<figure><div class="g"><img src="${g.src}" alt="${esc(t(g.cap))}" class="${g.fit ? 'fit' : ''}" loading="lazy"></div><figcaption class="meta">${esc(t(g.cap))}</figcaption></figure>`).join('')}</div>${links ? `<div class="links">${links}</div>` : ''}`]
        ].filter(Boolean);
        return B.map(([h, body], n) => `<section class="block"><h2 class="label">${String(n + 1).padStart(2, '0')} ${esc(t(h))}</h2><div class="body">${body}</div></section>`).join('');
      })()}
      </div>
      <nav class="pager">
        <a href="#${prev.id}"><span class="meta">← ${esc(t(UI.prev))} · ${prev.no}</span><span class="serif">${esc(prev.title)}</span></a>
        <a href="#${next.id}"><span class="meta">${esc(t(UI.next))} · ${next.no} →</span><span class="serif">${esc(next.title)}</span></a>
      </nav>`;
  }
  const $cards = document.getElementById('cards'), $case = document.getElementById('case-view'), $index = document.getElementById('index-view');
  function route() {
    const id = location.hash.replace('#', '');
    const hit = WORKS.some((w) => w.id === id);
    if (hit) { renderCase(id); $case.hidden = false; $index.hidden = true; window.scrollTo(0, 0); document.title = `${WORKS.find((w) => w.id === id).title} · BE MY AURA`; }
    else { $case.hidden = true; $index.hidden = false; document.title = 'Work · BE MY AURA'; }
  }
  renderIndex(); route();
  addEventListener('hashchange', route);
})();
</script>
